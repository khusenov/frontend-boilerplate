name: Bug report
description: Something behaves differently from what the documentation describes
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, do not use this form — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that triggers it. Include the failing request and response from the browser's network panel if the API is involved.
      placeholder: |
        1. npm run dev
        2. Open http://localhost:5173/sign-in and submit valid credentials
        3. The page stays on /sign-in instead of opening /
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console or error output
      description: Paste the relevant browser console or terminal output. Redact any token or personal data before pasting.
      render: text

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Name and version, from the browser's About page"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: 'Name and version'
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: CI builds with the version pinned in `.nvmrc`.
      placeholder: 'node --version'
    validations:
      required: true

  - type: dropdown
    id: how-run
    attributes:
      label: How are you running it
      options:
        - npm run dev
        - npm run build && npm run preview
        - Deployed elsewhere
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: The API at `VITE_API_BASE_URL` serves the endpoints involved, or the problem does not need an API
          required: true
        - label: '`npm run audit` reproduces the problem, or the problem is not covered by it'
          required: false
