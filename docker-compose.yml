services:
  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/v1}
    ports:
      - '${WEB_PORT:-8080}:8080'
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8000}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
